databaseChangeLog:
  - changeSet:
      id: 004-create-audit-logs
      author: ali
      changes:
        - createTable:
            tableName: audit_logs
            columns:
              - column: { name: id, type: BIGSERIAL, constraints: { primaryKey: true } }
              - column: { name: actor_user_id, type: BIGINT }
              - column: { name: actor_email, type: VARCHAR(180) }
              - column: { name: actor_role, type: VARCHAR(40) }
              - column: { name: action, type: VARCHAR(80), constraints: { nullable: false } }
              - column: { name: entity_type, type: VARCHAR(80) }
              - column: { name: entity_id, type: VARCHAR(80) }
              - column: { name: status, type: VARCHAR(40), constraints: { nullable: false } }
              - column: { name: message, type: VARCHAR(500) }
              - column: { name: metadata_json, type: TEXT }
              - column: { name: ip_address, type: VARCHAR(80) }
              - column: { name: user_agent, type: VARCHAR(500) }
              - column: { name: created_at, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: audit_logs
            baseColumnNames: actor_user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_audit_logs_actor_user
        - createIndex:
            tableName: audit_logs
            indexName: idx_audit_logs_created_at
            columns:
              - column: { name: created_at }
        - createIndex:
            tableName: audit_logs
            indexName: idx_audit_logs_actor_email
            columns:
              - column: { name: actor_email }
        - createIndex:
            tableName: audit_logs
            indexName: idx_audit_logs_action
            columns:
              - column: { name: action }
        - createIndex:
            tableName: audit_logs
            indexName: idx_audit_logs_entity
            columns:
              - column: { name: entity_type }
              - column: { name: entity_id }
