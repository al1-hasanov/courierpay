              SELECT setval(pg_get_serial_sequence('users', 'id'), (SELECT COALESCE(MAX(id), 1) FROM users), true);
              SELECT setval(pg_get_serial_sequence('companies', 'id'), (SELECT COALESCE(MAX(id), 1) FROM companies), true);
              SELECT setval(pg_get_serial_sequence('couriers', 'id'), (SELECT COALESCE(MAX(id), 1) FROM couriers), true);
              SELECT setval(pg_get_serial_sequence('balances', 'id'), (SELECT COALESCE(MAX(id), 1) FROM balances), true);
              SELECT setval(pg_get_serial_sequence('earnings', 'id'), (SELECT COALESCE(MAX(id), 1) FROM earnings), true);
              SELECT setval(pg_get_serial_sequence('payouts', 'id'), (SELECT COALESCE(MAX(id), 1) FROM payouts), true);
