                (10004, 10001, 'COMMISSION_DEBIT', 8.50, 10002, 'Demo commission recorded', NOW() - INTERVAL '3 days'),
                (10005, 10001, 'PAYOUT_DEBIT', 50.00, 10001, 'Demo payout completed', NOW() - INTERVAL '2 days'),
