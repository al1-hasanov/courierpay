                (10105, 'emin.safarov@courierpay.dev', '$2y$10$H48LOHBbUJK.IwTSoY40pOs127TR/A83Aa1I0C.LxUD2nkvJXXrSW', 'Emin Safarov', 'COURIER', 'ACTIVE', NOW())
              ON CONFLICT DO NOTHING;

              INSERT INTO companies (id, name, commission_rate, created_at) VALUES
                (10001, 'Wolt Demo Fleet', 10.00, NOW()),
                (10002, 'Bolt Demo Fleet', 12.50, NOW()),
