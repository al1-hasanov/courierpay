databaseChangeLog:
  - changeSet:
      id: 003-seed-demo-admin-and-courier-data
      author: ali
      context: demo
      dbms: postgresql
      comment: Optional demo seed data for the deployed admin UI. Runs only when LIQUIBASE_CONTEXTS=demo is enabled.
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              INSERT INTO users (id, email, password_hash, full_name, role, status, created_at) VALUES
                (10001, 'admin@courierpay.dev', '$2y$10$9aQFVT0Jz5BWGnJnw/tkJeP6lijn1JxAtXudTPL7c5kFCOseFQRYy', 'CourierPay Admin', 'ADMIN', 'ACTIVE', NOW()),
