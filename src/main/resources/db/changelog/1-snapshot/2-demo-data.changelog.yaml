                (10101, 'rashad.mammadov@courierpay.dev', '$2y$10$H48LOHBbUJK.IwTSoY40pOs127TR/A83Aa1I0C.LxUD2nkvJXXrSW', 'Rashad Mammadov', 'COURIER', 'ACTIVE', NOW()),
                (10102, 'leyla.aliyeva@courierpay.dev', '$2y$10$H48LOHBbUJK.IwTSoY40pOs127TR/A83Aa1I0C.LxUD2nkvJXXrSW', 'Leyla Aliyeva', 'COURIER', 'ACTIVE', NOW()),
                (10103, 'murad.huseynov@courierpay.dev', '$2y$10$H48LOHBbUJK.IwTSoY40pOs127TR/A83Aa1I0C.LxUD2nkvJXXrSW', 'Murad Huseynov', 'COURIER', 'ACTIVE', NOW()),
