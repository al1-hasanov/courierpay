name: Java CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: courierpay
          POSTGRES_USER: courierpay
          POSTGRES_PASSWORD: courierpay
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U courierpay -d courierpay"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn test
        env:
          SPRING_DATASOURCE_HOST: localhost
          SPRING_DATASOURCE_PORT: 5432
          SPRING_DATASOURCE_DATABASE: courierpay
          SPRING_DATASOURCE_USERNAME: courierpay
          SPRING_DATASOURCE_PASSWORD: courierpay
          KAFKA_ENABLED: false